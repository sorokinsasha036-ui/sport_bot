
{% extends "admin/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="admin-page-header">

    <div>
        <h1>{{ title }}</h1>
        <p>Заповніть інформацію про послугу.</p>
    </div>

</div>


<div class="admin-card">

    <form method="POST">

        <div class="form-group">

            <label for="name">
                Назва послуги
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ service.name if service else '' }}"
                placeholder="Наприклад: Веб-розробка"
                required>

        </div>


        <div class="form-group">

            <label for="category">
                Категорія
            </label>

            <input
                type="text"
                id="category"
                name="category"
                class="form-control"
                value="{{ service.category if service else '' }}"
                placeholder="Наприклад: Веб-розробка"
                required>

        </div>


        <div class="form-group">

            <label for="description">
                Опис
            </label>

            <textarea
                id="description"
                name="description"
                class="form-control"
                rows="6"
                placeholder="Опишіть послугу..."
                required>{{ service.description if service else '' }}</textarea>

        </div>


        <div class="form-group">

            <label for="price">
                Ціна від, ₴
            </label>

            <input
                type="number"
                id="price"
                name="price"
                class="form-control"
                value="{{ service.price if service else '' }}"
                min="0"
                step="0.01"
                placeholder="5000"
                required>

        </div>


        <div class="admin-actions">

            <button
                type="submit"
                class="btn btn-primary">
                Зберегти
            </button>

            <a
                href="{{ url_for('admin_services') }}"
                class="btn btn-secondary">
                Скасувати
            </a>

        </div>

    </form>

</div>

{% endblock %}
